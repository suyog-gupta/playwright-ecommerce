{% extends 'base.html' %}
{% block title %}Log in - ShopLite{% endblock %}
{% block content %}
<div class="auth-card"><h1>Log in</h1><form method="post">
  <label>Email<input type="email" name="email" required autocomplete="email" data-testid="login-email"></label>
  <label>Password<input type="password" name="password" required data-testid="login-password"></label>
  <button type="submit" data-testid="login-submit">Log in</button>
</form><p>New here? <a href="{{ url_for('signup') }}">Create an account</a></p></div>
{% endblock %}
